(function () {
  const planWeeks = [
    { week: 1,  dates: "Jul 6–12",     totalMiles: 50, phase: "Base Build",    phaseVar: "--phase-base-build" },
    { week: 2,  dates: "Jul 13–19",    totalMiles: 54, phase: "Base Build",    phaseVar: "--phase-base-build" },
    { week: 3,  dates: "Jul 20–26",    totalMiles: 58, phase: "Base Build",    phaseVar: "--phase-base-build" },
    { week: 4,  dates: "Jul 27–Aug 2", totalMiles: 48, phase: "Base Build",    phaseVar: "--phase-base-build" },
    { week: 5,  dates: "Aug 3–9",      totalMiles: 62, phase: "Peak Build",    phaseVar: "--phase-peak-build" },
    { week: 6,  dates: "Aug 10–16",    totalMiles: 66, phase: "Peak Build",    phaseVar: "--phase-peak-build" },
    { week: 7,  dates: "Aug 17–23",    totalMiles: 70, phase: "Peak Build",    phaseVar: "--phase-peak-build" },
    { week: 8,  dates: "Aug 24–30",    totalMiles: 55, phase: "Recovery",      phaseVar: "--phase-recovery" },
    { week: 9,  dates: "Aug 31–Sep 6", totalMiles: 68, phase: "Marathon Prep", phaseVar: "--phase-marathon-prep" },
    { week: 10, dates: "Sep 7–13",     totalMiles: 56, phase: "Marathon Prep", phaseVar: "--phase-marathon-prep" },
    { week: 11, dates: "Sep 14–20",    totalMiles: 48, phase: "Race Week",     phaseVar: "--phase-race-week" },
  ];

  const monthIndex = {
    Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5,
    Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11,
  };

  function parseRange(dates) {
    const m = dates.match(/^([A-Z][a-z]{2}) (\d+)–(?:([A-Z][a-z]{2}) )?(\d+)$/);
    if (!m) return null;
    const sm = m[1], em = m[3] || m[1];
    return {
      start: new Date(2026, monthIndex[sm], +m[2]),
      end:   new Date(2026, monthIndex[em], +m[4]),
    };
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  let activeIndex = planWeeks.findIndex(function (w) {
    const r = parseRange(w.dates);
    return r && today >= r.start && today <= r.end;
  });
  if (activeIndex < 0) activeIndex = today < new Date(2026, 6, 6) ? 0 : planWeeks.length - 1;

  const active = planWeeks[activeIndex];

  const raceDate = new Date(2026, 8, 20);
  raceDate.setHours(0, 0, 0, 0);
  const daysOut  = Math.ceil((raceDate - today) / 86400000);
  const weeksOut = Math.max(0, Math.ceil(daysOut / 7));

  // Update stats
  document.getElementById('stat-weeks-out').textContent = weeksOut;
  document.getElementById('stat-this-week').textContent = active.totalMiles + ' mi';
  document.getElementById('snapshot-phase-name').textContent = active.phase.toLowerCase();
  document.getElementById('snapshot-phase-dot').style.background = 'var(' + active.phaseVar + ')';
  document.getElementById('snapshot-card').style.borderLeftColor = 'var(' + active.phaseVar + ')';

  // Build chart bars
  const maxMiles = 72;
  const chart = document.getElementById('snapshot-chart');
  planWeeks.forEach(function (w, i) {
    const bar = document.createElement('div');
    bar.className = 'snapshot-bar' + (i === activeIndex ? ' current' : '');
    bar.style.height = Math.round((Math.min(w.totalMiles, maxMiles) / maxMiles) * 48) + 'px';
    bar.style.background = 'var(' + w.phaseVar + ')';
    bar.title = 'Wk ' + w.week + ' · ' + w.totalMiles + ' mi · ' + w.phase;
    chart.appendChild(bar);
  });
})();
</script>
