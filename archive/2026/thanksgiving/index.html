<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>thanksgiving 2026</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--paper: #F7F5EC;--ink: #1C1C1C;--ink-muted: #6A6760;--orange: #EF5B25;--grid: rgba(168, 166, 196, .45);--border-subtle: #C8C6B8;--grid-unit: 22px;--phase-base-build: #BF8C52;--phase-peak-build: #B05A28;--phase-recovery: #9A7A58;--phase-marathon-prep: #8C4E32;--phase-final-build: #6E4025;--phase-taper: #C8942A;--phase-race-week: #4E2416}*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}body{font-family:IBM Plex Mono,Courier New,monospace;background-color:var(--paper);background-image:radial-gradient(circle,var(--grid) 1.2px,transparent 1.2px);background-size:var(--grid-unit) var(--grid-unit);color:var(--ink);min-height:100vh}a{color:inherit;text-decoration:none}.hover-link{color:var(--ink-muted);display:inline-block;padding-bottom:1px;border-bottom:1px solid transparent;transition:color .15s ease,border-color .15s ease}.hover-link:hover{color:var(--ink);border-bottom-color:var(--orange)}
:root{--ink: #0F0E0B;--ink-muted: #2E2C28}#header{border-bottom:1px solid var(--border-subtle);padding:2rem 1.5rem 1.5rem}#header .inner{max-width:800px;margin:0 auto}.eyebrow{font-size:.8rem;letter-spacing:.2em;color:var(--ink-muted);text-transform:uppercase;margin-bottom:.5rem}h1{font-family:"DM Serif Display",Georgia,serif;font-size:2rem;font-weight:400;color:var(--ink);line-height:1.2}.sub{font-size:.85rem;color:var(--ink-muted);margin-top:.35rem}#status{font-size:.75rem;color:var(--ink-muted);margin-top:.75rem;letter-spacing:.05em}#status.err{color:var(--orange)}#locked{max-width:800px;margin:0 auto;padding:3rem 1.5rem;font-size:.9rem;color:var(--ink-muted);line-height:1.6}#app{max-width:800px;margin:0 auto;padding:1.5rem 1rem 3rem;display:grid;grid-template-columns:minmax(0,1fr);gap:2rem}#app[hidden],#locked[hidden]{display:none}.section-title{font-size:.85rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.5rem}.tally{font-size:.8rem;color:var(--ink-muted);margin-bottom:.75rem}.tally b{color:var(--orange);font-weight:600}.tbl-wrap{overflow-x:auto;border:1px solid var(--border-subtle);border-radius:8px}.tg-table{border-collapse:collapse;width:100%}.tg-table th,.tg-table td{padding:.55rem .75rem;text-align:left;font-size:.82rem;color:var(--ink-muted)}.tg-table th{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:#c8c6b833;border-bottom:1px solid var(--border-subtle)}.tg-table td{border-top:1px solid var(--border-subtle)}.tg-table tbody tr:first-child td{border-top:0}.tg-table td.main{color:var(--ink);font-weight:600}.tg-table td.act{text-align:right;white-space:nowrap}.empty{padding:.9rem .75rem;font-size:.8rem;color:var(--ink-muted)}.cat{display:inline-block;padding:.1rem .55rem;border:1px solid currentColor;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.04em;line-height:1.5;white-space:nowrap;color:#454238;background:#e4e2d6}.cat-main{color:#7a2e12;background:#f6ddd0}.cat-side{color:#1f5a2e;background:#d9ecd8}.cat-dessert{color:#7a2350;background:#f4dbe6}.cat-snack{color:#6b4a00;background:#f7e4a8}.cat-drinks{color:#14527a;background:#d6e8f4}.tg-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-top:.75rem;align-items:end}.tg-form label{display:grid;gap:.2rem;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}.tg-form input,.tg-form select,#notes{font-family:IBM Plex Mono,monospace;font-size:.85rem;padding:.45rem .5rem;border:1px solid var(--border-subtle);border-radius:4px;background:#fff9;color:var(--ink)}#notes{width:100%;min-height:8rem;line-height:1.5;resize:vertical;box-sizing:border-box}.btn{font-family:IBM Plex Mono,monospace;font-size:.8rem;padding:.45rem .8rem;border:1px solid var(--ink);border-radius:4px;background:var(--ink);color:var(--paper);cursor:pointer}.btn.link{border:0;background:none;color:var(--ink-muted);text-decoration:underline;padding:.2rem .4rem}.btn.link:hover{color:var(--orange)}
</style></head> <body>   <div id="header"> <div class="inner"> <div class="eyebrow">Thanksgiving 2026 &middot; family planning</div> <h1>Who's bringing what</h1> <p class="sub">Add your dish, tell us how many are coming, and leave notes. Everyone sees updates.</p> <p id="status" aria-live="polite"></p> </div> </div> <div id="locked" hidden>
This page is private. Ask Jordan for the link.
</div> <div id="app" hidden> <section> <h2 class="section-title">Dishes</h2> <p class="tally" id="dish-tally"></p> <div class="tbl-wrap"> <table class="tg-table"> <thead><tr><th>Who</th><th>Dish</th><th>Type</th><th></th></tr></thead> <tbody id="dish-rows"></tbody> </table> </div> <form class="tg-form" id="dish-form" autocomplete="off"> <label>Who<input name="who" required maxlength="60"></label> <label>Dish<input name="dish" required maxlength="120"></label> <label>Type
<select name="category"> <option>Main</option><option>Side</option><option>Dessert</option><option>Snack</option><option>Drinks</option><option>Other</option> </select> </label> <button class="btn" type="submit" id="dish-submit">Add dish</button> </form> </section> <section> <h2 class="section-title">Headcount</h2> <p class="tally" id="rsvp-tally"></p> <div class="tbl-wrap"> <table class="tg-table"> <thead><tr><th>Family</th><th>People</th><th>Dietary</th><th></th></tr></thead> <tbody id="rsvp-rows"></tbody> </table> </div> <form class="tg-form" id="rsvp-form" autocomplete="off"> <label>Family<input name="family" required maxlength="60"></label> <label>People<input name="count" type="number" min="0" max="99" required></label> <label>Dietary<input name="dietary" maxlength="200"></label> <button class="btn" type="submit" id="rsvp-submit">Add family</button> </form> </section> <section> <h2 class="section-title">Notes</h2> <textarea id="notes" maxlength="4000" placeholder="Time, location, who's hosting, parking..."></textarea> </section> </div> <script>
(function () {
  // Set to the deployed Worker URL (printed by `npx wrangler deploy`).
  var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://localhost:8787'
    : 'https://thanksgiving.jordannienow.workers.dev';
  var TOKEN_KEY = 'tg_token';
  var POLL_MS = 20000;

  var doc = { dishes: [], rsvps: [], notes: '', rev: 0 };
  var pending = 0;
  var queue = Promise.resolve();
  var editing = { dish: null, rsvp: null };

  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $('status');

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? 'err' : '';
  }

  // Token: take it from ?t=, remember it, and remove it from the address bar.
  var params = new URLSearchParams(location.search);
  if (params.get('t')) {
    localStorage.setItem(TOKEN_KEY, params.get('t'));
    history.replaceState(null, '', location.pathname);
  }
  var token = localStorage.getItem(TOKEN_KEY);

  function lock() {
    localStorage.removeItem(TOKEN_KEY);
    $('app').hidden = true;
    $('locked').hidden = false;
    statusEl.textContent = '';
  }

  if (!token) { lock(); return; }

  function request(method, body) {
    return fetch(API + '/state', {
      method: method,
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function cell(text, cls) { return el('td', cls, text); }

  function actions(onEdit, onDelete) {
    var td = el('td', 'act');
    var e = el('button', 'btn link', 'edit');
    e.type = 'button';
    e.addEventListener('click', onEdit);
    var d = el('button', 'btn link', 'remove');
    d.type = 'button';
    d.addEventListener('click', onDelete);
    td.appendChild(e);
    td.appendChild(d);
    return td;
  }

  function render() {
    var dishRows = $('dish-rows');
    dishRows.textContent = '';
    if (!doc.dishes.length) {
      var tr0 = el('tr');
      var c0 = el('td', 'empty', 'Nothing yet. Be the first.');
      c0.colSpan = 4;
      tr0.appendChild(c0);
      dishRows.appendChild(tr0);
    }
    doc.dishes.forEach(function (d) {
      var tr = el('tr');
      tr.appendChild(cell(d.who));
      tr.appendChild(cell(d.dish, 'main'));
      var tdCat = el('td');
      tdCat.appendChild(el('span', 'cat cat-' + d.category.toLowerCase().replace(/[^a-z0-9]/g, ''), d.category));
      tr.appendChild(tdCat);
      tr.appendChild(actions(
        function () { startEdit('dish', d); },
        function () { mutate(function (x) { x.dishes = x.dishes.filter(function (i) { return i.id !== d.id; }); }); }
      ));
      dishRows.appendChild(tr);
    });
    var counts = {};
    doc.dishes.forEach(function (d) { counts[d.category] = (counts[d.category] || 0) + 1; });
    var parts = Object.keys(counts).map(function (k) { return counts[k] + ' ' + k.toLowerCase(); });
    $('dish-tally').textContent = doc.dishes.length ? doc.dishes.length + ' dishes: ' + parts.join(', ') : '';

    var rsvpRows = $('rsvp-rows');
    rsvpRows.textContent = '';
    if (!doc.rsvps.length) {
      var tr1 = el('tr');
      var c1 = el('td', 'empty', 'No families added yet.');
      c1.colSpan = 4;
      tr1.appendChild(c1);
      rsvpRows.appendChild(tr1);
    }
    var total = 0;
    doc.rsvps.forEach(function (r) {
      total += r.count;
      var tr = el('tr');
      tr.appendChild(cell(r.family, 'main'));
      tr.appendChild(cell(String(r.count)));
      tr.appendChild(cell(r.dietary));
      tr.appendChild(actions(
        function () { startEdit('rsvp', r); },
        function () { mutate(function (x) { x.rsvps = x.rsvps.filter(function (i) { return i.id !== r.id; }); }); }
      ));
      rsvpRows.appendChild(tr);
    });
    var tally = $('rsvp-tally');
    tally.textContent = '';
    if (doc.rsvps.length) {
      var b = el('b', '', String(total));
      tally.appendChild(b);
      tally.appendChild(document.createTextNode(' people across ' + doc.rsvps.length + ' families'));
    }

    // Don't overwrite the notes box while someone is typing in it.
    var notes = $('notes');
    if (document.activeElement !== notes && notes.value !== doc.notes) notes.value = doc.notes;
  }

  // Apply a change locally right away, then save it. If the server's copy moved on
  // (409), take its copy, re-apply the same change, and try once more.
  function mutate(fn) {
    fn(doc);
    render();
    pending++;
    queue = queue.then(function () { return save(fn, false); }).then(function () { pending--; }, function () { pending--; });
  }

  function save(fn, retried) {
    setStatus('saving...');
    return request('PUT', { rev: doc.rev, dishes: doc.dishes, rsvps: doc.rsvps, notes: doc.notes })
      .then(function (res) {
        if (res.status === 401) { lock(); return; }
        if (res.status === 409 && !retried) {
          return res.json().then(function (body) {
            doc = body.doc;
            fn(doc);
            render();
            return save(fn, true);
          });
        }
        if (!res.ok) throw new Error('save failed');
        return res.json().then(function (next) {
          doc.rev = next.rev;
          setStatus('saved');
        });
      })
      .catch(function () { setStatus('could not save, check your connection', true); });
  }

  function load() {
    if (pending > 0) return Promise.resolve();
    return request('GET').then(function (res) {
      if (res.status === 401) { lock(); return; }
      if (!res.ok) throw new Error('load failed');
      return res.json().then(function (next) {
        if (pending > 0) return;
        doc = next;
        $('locked').hidden = true;
        $('app').hidden = false;
        render();
        setStatus('up to date');
      });
    }).catch(function () { setStatus('offline, will retry', true); });
  }

  // Edit mode: the form is reused, and submitting replaces the entry with the same id.
  function startEdit(kind, item) {
    editing[kind] = item.id;
    var form = $(kind + '-form');
    if (kind === 'dish') {
      form.who.value = item.who; form.dish.value = item.dish; form.category.value = item.category;
      $('dish-submit').textContent = 'Save dish';
    } else {
      form.family.value = item.family; form.count.value = item.count; form.dietary.value = item.dietary;
      $('rsvp-submit').textContent = 'Save family';
    }
    form.elements[0].focus();
  }

  function finishEdit(kind) {
    editing[kind] = null;
    $(kind + '-form').reset();
    $(kind + '-submit').textContent = kind === 'dish' ? 'Add dish' : 'Add family';
  }

  $('dish-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    var entry = { id: editing.dish || newId(), who: f.who.value.trim(), dish: f.dish.value.trim(), category: f.category.value };
    mutate(function (x) {
      var i = x.dishes.findIndex(function (d) { return d.id === entry.id; });
      if (i >= 0) x.dishes[i] = entry; else x.dishes.push(entry);
    });
    finishEdit('dish');
  });

  $('rsvp-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = ev.target;
    var entry = { id: editing.rsvp || newId(), family: f.family.value.trim(), count: parseInt(f.count.value, 10) || 0, dietary: f.dietary.value.trim() };
    mutate(function (x) {
      var i = x.rsvps.findIndex(function (r) { return r.id === entry.id; });
      if (i >= 0) x.rsvps[i] = entry; else x.rsvps.push(entry);
    });
    finishEdit('rsvp');
  });

  var notesTimer = null;
  $('notes').addEventListener('input', function (ev) {
    var value = ev.target.value;
    clearTimeout(notesTimer);
    notesTimer = setTimeout(function () { mutate(function (x) { x.notes = value; }); }, 800);
  });

  load();
  setInterval(function () { if (!document.hidden) load(); }, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>  </body></html>
